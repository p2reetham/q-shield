version: "3.9"

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite:///./qshield.db
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - DEMO_MODE=true
    volumes:
      - qshield-data:/app/data

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  qshield-data:
